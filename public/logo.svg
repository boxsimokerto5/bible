<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="vintageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Warm Drop Shadow for Cross -->
    <filter id="warmShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5c3818" flood-opacity="0.3" />
    </filter>

    <!-- Antique Parchment Radial Background Gradient -->
    <radialGradient id="parchmentBg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fffef7" />
      <stop offset="40%" stop-color="#faf2df" />
      <stop offset="75%" stop-color="#ebd9b5" />
      <stop offset="100%" stop-color="#dac092" />
    </radialGradient>

    <!-- Divine Golden Halo Gradient -->
    <radialGradient id="divineGoldenHalo" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Polished Gold Highlight Facet -->
    <linearGradient id="goldLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef0" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Polished Gold Shadow Facet -->
    <linearGradient id="goldDarkFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#b45309" />
      <stop offset="75%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Antique Filigree Gold Border Gradient -->
    <linearGradient id="antiqueGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>
  </defs>

  <!-- Warm Vintage Parchment Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#parchmentBg)" stroke="#c29b68" stroke-width="2" />

  <!-- Double Antique Vintage Borders -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#antiqueGoldRing)" stroke-width="3" stroke-opacity="0.85" />
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#a16207" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="6 6" />

  <!-- Vintage Corner Filigree Ornaments -->
  <g stroke="#92400e" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M 44 68 L 68 44 L 92 44" />
    <circle cx="68" cy="68" r="3.5" fill="#b45309" />

    <path d="M 468 68 L 444 44 L 420 44" />
    <circle cx="444" cy="68" r="3.5" fill="#b45309" />

    <path d="M 44 444 L 68 468 L 92 468" />
    <circle cx="68" cy="444" r="3.5" fill="#b45309" />

    <path d="M 468 444 L 444 468 L 420 468" />
    <circle cx="444" cy="444" r="3.5" fill="#b45309" />
  </g>

  <!-- Divine Halo Radiant Aura behind Cross -->
  <circle cx="256" cy="196" r="148" fill="url(#divineGoldenHalo)" />

  <!-- Antique Sacred Rays -->
  <g stroke="#b45309" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
    <line x1="256" y1="196" x2="160" y2="100" />
    <line x1="256" y1="196" x2="352" y2="100" />
    <line x1="256" y1="196" x2="160" y2="292" />
    <line x1="256" y1="196" x2="352" y2="292" />

    <line x1="256" y1="196" x2="256" y2="56" opacity="0.55" stroke-width="1.6" />
    <line x1="256" y1="196" x2="116" y2="196" opacity="0.55" stroke-width="1.6" />
    <line x1="256" y1="196" x2="396" y2="196" opacity="0.55" stroke-width="1.6" />
    <line x1="256" y1="196" x2="256" y2="336" opacity="0.55" stroke-width="1.6" />
  </g>

  <!-- Sacred Celestial Halo Rings -->
  <circle cx="256" cy="196" r="88" fill="none" stroke="url(#antiqueGoldRing)" stroke-width="3" opacity="0.85" filter="url(#warmShadow)" />
  <circle cx="256" cy="196" r="96" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="3 6" opacity="0.4" />
  <circle cx="256" cy="196" r="80" fill="none" stroke="#d97706" stroke-width="1" opacity="0.35" />

  <!-- ==============================================
       THE ELEGANT 3D BEVELED GOLDEN CROSS
       ============================================== -->
  <g filter="url(#warmShadow)">
    <!-- Light Facets -->
    <path d="M 256 80 L 232 96 L 232 172 L 256 196 Z" fill="url(#goldLightFacet)" />
    <path d="M 256 196 L 232 220 L 232 408 L 256 424 Z" fill="url(#goldLightFacet)" />
    <path d="M 128 196 L 144 172 L 232 172 L 256 196 Z" fill="url(#goldLightFacet)" />
    <path d="M 128 196 L 144 220 L 232 220 L 256 196 Z" fill="url(#goldDarkFacet)" />

    <!-- Shaded Facets -->
    <path d="M 256 80 L 280 96 L 280 172 L 256 196 Z" fill="url(#goldDarkFacet)" />
    <path d="M 256 196 L 280 220 L 280 408 L 256 424 Z" fill="url(#goldDarkFacet)" />
    <path d="M 256 196 L 280 172 L 368 172 L 384 196 Z" fill="url(#goldLightFacet)" />
    <path d="M 256 196 L 280 220 L 368 220 L 384 196 Z" fill="url(#goldDarkFacet)" />

    <!-- Apex Point Finials -->
    <polygon points="256,64 232,96 256,80" fill="url(#goldLightFacet)" />
    <polygon points="256,64 280,96 256,80" fill="url(#goldDarkFacet)" />
    <polygon points="112,196 144,172 128,196" fill="url(#goldLightFacet)" />
    <polygon points="112,196 144,220 128,196" fill="url(#goldDarkFacet)" />
    <polygon points="400,196 368,172 384,196" fill="url(#goldLightFacet)" />
    <polygon points="400,196 368,220 384,196" fill="url(#goldDarkFacet)" />
    <polygon points="256,440 232,408 256,424" fill="url(#goldLightFacet)" />
    <polygon points="256,440 280,408 256,424" fill="url(#goldDarkFacet)" />

    <!-- Sharp Center Gleam Lines -->
    <line x1="256" y1="64" x2="256" y2="440" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95" />
    <line x1="112" y1="196" x2="400" y2="196" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95" />

    <!-- Outer Fine Bevel Borders -->
    <polygon points="256,64 280,96 280,172 368,172 400,196 368,220 280,220 280,408 256,440 232,408 232,220 144,220 112,196 144,172 232,172 232,96" 
             fill="none" stroke="url(#antiqueGoldRing)" stroke-width="1.8" stroke-linejoin="round" opacity="0.9" />

    <!-- Center Diamond Medallion -->
    <g transform="translate(256, 196)">
      <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#goldLightFacet)" stroke="#ffffff" stroke-width="1.2" />
      <polygon points="0,-10 10,0 0,10 -10,0" fill="#ffffff" opacity="0.95" />
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b" />
    </g>
  </g>

  <!-- Bethlehem Star Sparkle Centerpiece -->
  <g transform="translate(256, 196)" opacity="0.95">
    <path d="M 0,-34 Q 0,0 34,0 Q 0,0 0,34 Q 0,0 -34,0 Q 0,0 0,-34 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" filter="url(#vintageGlow)" />
  </g>

  <!-- Alpha & Omega Sacred Vintage Inscriptions -->
  <g transform="translate(188, 150)" opacity="0.5">
    <text font-family="'Cinzel', 'EB Garamond', serif" font-size="20" font-weight="700" fill="#78350f" text-anchor="middle">Α</text>
  </g>
  <g transform="translate(324, 150)" opacity="0.5">
    <text font-family="'Cinzel', 'EB Garamond', serif" font-size="20" font-weight="700" fill="#78350f" text-anchor="middle">Ω</text>
  </g>

  <!-- Lower Title / Ribbon Text: "ALKITAB" -->
  <g transform="translate(256, 474)">
    <text font-family="'Cinzel', 'EB Garamond', serif" font-size="14" font-weight="800" fill="#78350f" letter-spacing="6" text-anchor="middle" opacity="0.9">
      ALKITAB
    </text>
  </g>
</svg>
