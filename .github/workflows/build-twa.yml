name: Build Android TWA (AAB & APK)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android Version Code (e.g. 1, 2, 3)'
        required: false
        default: ''
      version_name:
        description: 'Android Version Name (e.g. 1.0.0, 1.0.1)'
        required: false
        default: ''

jobs:
  build:
    name: Build TWA App Bundle (.aab) & APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "Konfigurasi Bubblewrap selesai:"
          cat ~/.bubblewrap/config.json

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan Keystore dari GitHub Secret..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          elif [ -f "release.keystore" ]; then
            echo "Menggunakan release.keystore yang ada di repositori..."
          elif [ -f "release.keystore.base64" ]; then
            echo "Mendekode release.keystore.base64..."
            base64 -d release.keystore.base64 > release.keystore
          else
            echo "Error: File release.keystore tidak ditemukan!"
            exit 1
          fi

      - name: Update Version Info (If Specified)
        run: |
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            echo "Mengupdate Version Code ke: ${{ github.event.inputs.version_code }}"
            node -e "
              const fs = require('fs');
              const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
              manifest.appVersionCode = parseInt('${{ github.event.inputs.version_code }}', 10);
              if ('${{ github.event.inputs.version_name }}') {
                manifest.appVersionName = '${{ github.event.inputs.version_name }}';
              }
              fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
            "
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            echo "Mengupdate Version Name ke: ${{ github.event.inputs.version_name }}"
            node -e "
              const fs = require('fs');
              const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
              manifest.appVersionName = '${{ github.event.inputs.version_name }}';
              fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
            "
          fi
          # Sinkronkan manifest-checksum.txt setelah perubahan
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const sum = crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex');
            fs.writeFileSync('manifest-checksum.txt', sum);
            console.log('SHA1 Checksum:', sum);
          "
          cat twa-manifest.json | grep -E 'appVersion|packageId'

      - name: Build Android App (AAB & APK)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'alkitabdigital123' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'alkitabdigital123' }}
        run: |
          # Buat direktori output
          mkdir -p output

          # 1. Pastikan manifest-checksum.txt ada dan akurat
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const sum = crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex');
            fs.writeFileSync('manifest-checksum.txt', sum);
            console.log('Manifest checksum siap:', sum);
          "

          # 2. Generate/Update struktur proyek Android TWA secara non-interaktif
          yes | bubblewrap update --skipVersionUpgrade || true

          # 3. Beri izin eksekusi gradlew jika dibuat
          chmod +x ./gradlew 2>/dev/null || true

          # 4. Jalankan build AAB dan APK secara non-interaktif
          yes | bubblewrap build --skipPwaValidation

          # 5. Kumpulkan hasil build .aab dan .apk
          find . -name "*.aab" -exec cp {} output/ \;
          find . -name "*.apk" -exec cp {} output/ \;
          cp public/.well-known/assetlinks.json output/ || true

          echo "Daftar hasil build di folder output/:"
          ls -lh output/

      - name: Upload Build Artifacts (Play Store AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: alkitab-digital-android-release
          path: |
            output/*.aab
            output/*.apk
            output/assetlinks.json
          retention-days: 60
