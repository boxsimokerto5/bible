<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow Filter -->
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Deep Royal Background Radial Gradient -->
    <radialGradient id="bgRadiance" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Radiant Divine Halo Gradient -->
    <radialGradient id="haloGlow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Metallic Left Facet Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde68a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Golden Metallic Right/Shadow Facet Gradient -->
    <linearGradient id="goldDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Golden Bevel Ridge Light -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stroke-opacity="0.9" />
      <stop offset="40%" stop-color="#fef08a" stroke-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stroke-opacity="0.2" />
    </linearGradient>

    <!-- Emblem Circular Ring Gradient -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Dove / Olive Branch Subtle Accent Gradient -->
    <linearGradient id="pureLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgRadiance)" />

  <!-- Outer Elegant Golden Filigree Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#ringGold)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#ringGold)" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 8" />

  <!-- Corner Ornamental Accents -->
  <g stroke="url(#ringGold)" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 44 64 L 64 44 L 84 44" />
    <circle cx="64" cy="64" r="3" fill="#f59e0b" />
    
    <path d="M 468 64 L 448 44 L 428 44" />
    <circle cx="448" cy="64" r="3" fill="#f59e0b" />
    
    <path d="M 44 448 L 64 468 L 84 468" />
    <circle cx="64" cy="448" r="3" fill="#f59e0b" />
    
    <path d="M 468 448 L 448 468 L 428 468" />
    <circle cx="448" cy="448" r="3" fill="#f59e0b" />
  </g>

  <!-- Divine Halo Radiant Aura behind the Cross Center -->
  <circle cx="256" cy="196" r="148" fill="url(#haloGlow)" />
  
  <!-- Sacred Light Rays -->
  <g stroke="url(#goldHighlight)" stroke-width="1.2" opacity="0.4" stroke-linecap="round">
    <!-- Diagonal Rays -->
    <line x1="256" y1="196" x2="160" y2="100" />
    <line x1="256" y1="196" x2="352" y2="100" />
    <line x1="256" y1="196" x2="160" y2="292" />
    <line x1="256" y1="196" x2="352" y2="292" />

    <!-- Cardinal Rays -->
    <line x1="256" y1="196" x2="256" y2="60" opacity="0.6" stroke-width="1.5" />
    <line x1="256" y1="196" x2="120" y2="196" opacity="0.6" stroke-width="1.5" />
    <line x1="256" y1="196" x2="392" y2="196" opacity="0.6" stroke-width="1.5" />
    <line x1="256" y1="196" x2="256" y2="332" opacity="0.6" stroke-width="1.5" />

    <!-- Secondary Fine Rays -->
    <line x1="256" y1="196" x2="204" y2="76" opacity="0.25" />
    <line x1="256" y1="196" x2="308" y2="76" opacity="0.25" />
    <line x1="256" y1="196" x2="136" y2="144" opacity="0.25" />
    <line x1="256" y1="196" x2="376" y2="144" opacity="0.25" />
    <line x1="256" y1="196" x2="136" y2="248" opacity="0.25" />
    <line x1="256" y1="196" x2="376" y2="248" opacity="0.25" />
  </g>

  <!-- Sacred Celestial Halo Ring behind Cross -->
  <circle cx="256" cy="196" r="88" fill="none" stroke="url(#ringGold)" stroke-width="3" opacity="0.65" filter="url(#softShadow)" />
  <circle cx="256" cy="196" r="96" fill="none" stroke="url(#ringGold)" stroke-width="1" stroke-dasharray="3 6" opacity="0.4" />
  <circle cx="256" cy="196" r="80" fill="none" stroke="url(#ringGold)" stroke-width="1" opacity="0.3" />

  <!-- ==============================================
       THE ELEGANT FACETED 3D GOLDEN CROSS
       ============================================== -->
  
  <g filter="url(#softShadow)">
    
    <!-- LEFT & TOP-LEFT FACETS (Illuminated side) -->
    <!-- Top Arm - Left Half -->
    <path d="M 256 80 L 232 96 L 232 172 L 256 196 Z" fill="url(#goldLight)" />
    <!-- Bottom Arm - Left Half -->
    <path d="M 256 196 L 232 220 L 232 408 L 256 424 Z" fill="url(#goldLight)" />
    <!-- Left Arm - Top Half -->
    <path d="M 128 196 L 144 172 L 232 172 L 256 196 Z" fill="url(#goldLight)" />
    <!-- Left Arm - Bottom Half -->
    <path d="M 128 196 L 144 220 L 232 220 L 256 196 Z" fill="url(#goldDark)" />

    <!-- RIGHT & BOTTOM-RIGHT FACETS (Shaded side) -->
    <!-- Top Arm - Right Half -->
    <path d="M 256 80 L 280 96 L 280 172 L 256 196 Z" fill="url(#goldDark)" />
    <!-- Bottom Arm - Right Half -->
    <path d="M 256 196 L 280 220 L 280 408 L 256 424 Z" fill="url(#goldDark)" />
    <!-- Right Arm - Top Half -->
    <path d="M 256 196 L 280 172 L 368 172 L 384 196 Z" fill="url(#goldLight)" />
    <!-- Right Arm - Bottom Half -->
    <path d="M 256 196 L 280 220 L 368 220 L 384 196 Z" fill="url(#goldDark)" />

    <!-- POINTED APEX TRIMS / FINIALS -->
    <polygon points="256,64 232,96 256,80" fill="url(#goldLight)" />
    <polygon points="256,64 280,96 256,80" fill="url(#goldDark)" />
    
    <polygon points="112,196 144,172 128,196" fill="url(#goldLight)" />
    <polygon points="112,196 144,220 128,196" fill="url(#goldDark)" />

    <polygon points="400,196 368,172 384,196" fill="url(#goldLight)" />
    <polygon points="400,196 368,220 384,196" fill="url(#goldDark)" />

    <polygon points="256,440 232,408 256,424" fill="url(#goldLight)" />
    <polygon points="256,440 280,408 256,424" fill="url(#goldDark)" />

    <!-- SHARP CENTER RIDGE HIGHLIGHT LINES (Gleam effect) -->
    <line x1="256" y1="64" x2="256" y2="440" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95" />
    <line x1="112" y1="196" x2="400" y2="196" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95" />

    <!-- Outer Fine Bevel Borders -->
    <polygon points="256,64 280,96 280,172 368,172 400,196 368,220 280,220 280,408 256,440 232,408 232,220 144,220 112,196 144,172 232,172 232,96" 
             fill="none" stroke="url(#ringGold)" stroke-width="1.5" stroke-linejoin="round" opacity="0.75" />

    <!-- CENTER GEM / CROSS OF LIGHT EMBLEM -->
    <g transform="translate(256, 196)">
      <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#goldLight)" stroke="#ffffff" stroke-width="1" />
      <polygon points="0,-10 10,0 0,10 -10,0" fill="#ffffff" opacity="0.9" />
      <circle cx="0" cy="0" r="3" fill="#fffbeb" />
    </g>

  </g>

  <!-- Star of Bethlehem Sparkle at Cross Intersection -->
  <g transform="translate(256, 196)" opacity="0.95">
    <path d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z" fill="url(#pureLight)" opacity="0.85" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#divineGlow)" />
  </g>

  <!-- Alpha & Omega (Α - Ω) Inscriptions -->
  <g transform="translate(188, 150)" opacity="0.35">
    <text font-family="'Cinzel', 'EB Garamond', serif" font-size="20" font-weight="700" fill="#fef3c7" text-anchor="middle">Α</text>
  </g>
  <g transform="translate(324, 150)" opacity="0.35">
    <text font-family="'Cinzel', 'EB Garamond', serif" font-size="20" font-weight="700" fill="#fef3c7" text-anchor="middle">Ω</text>
  </g>

  <!-- Lower Title / Ribbon Text: "ALKITAB" -->
  <g transform="translate(256, 474)">
    <text font-family="'Cinzel', 'Plus Jakarta Sans', serif" font-size="13" font-weight="800" fill="#fde68a" letter-spacing="6" text-anchor="middle" opacity="0.8">
      ALKITAB
    </text>
  </g>
</svg>
